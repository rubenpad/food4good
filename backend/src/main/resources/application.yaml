spring:
  application:
    name: food4good
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/food4good}
    username: ${DATABASE_USER:food4good}
    password: ${DATABASE_PASSWORD:food4good}

management:
  endpoints:
    web:
      exposure:
        include: health
