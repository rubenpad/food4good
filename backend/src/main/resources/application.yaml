spring:
  application:
    name: food4good
  threads:
    virtual:
      enabled: true
  jackson:
    deserialization:
      # 1.5 is not a whole quantity; refuse it rather than truncating it to 1.
      accept-float-as-int: false
  flyway:
    placeholders:
      initial_stock: ${FOOD4GOOD_STORAGE_INITIAL_STOCK:5}
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/food4good}
    hikari:
      # The default of 10, plus one connection each for the three single-instance workers.
      maximum-pool-size: 13
      data-source-properties:
        # Sends a batch as one multi-row INSERT rather than a round trip per row.
        reWriteBatchedInserts: true
    username: ${DATABASE_USER:food4good}
    password: ${DATABASE_PASSWORD:food4good}

food4good:
  kitchen:
    cooks: ${FOOD4GOOD_KITCHEN_COOKS:4}
    max-wait: ${FOOD4GOOD_KITCHEN_MAX_WAIT:2h}
    preparation-time-scale: ${FOOD4GOOD_KITCHEN_PREPARATION_TIME_SCALE:1.0}
  market:
    url: ${FOOD4GOOD_MARKET_URL:http://localhost:8089}
    connect-timeout: ${FOOD4GOOD_MARKET_CONNECT_TIMEOUT:1s}
    read-timeout: ${FOOD4GOOD_MARKET_READ_TIMEOUT:2s}
    max-concurrent-calls: ${FOOD4GOOD_MARKET_MAX_CONCURRENT_CALLS:20}

management:
  endpoints:
    web:
      exposure:
        include: health
