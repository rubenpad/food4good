server {
  listen 80;

  # Docker's DNS. Resolving per request lets the gateway survive a recreated container,
  # which gets a new IP; proxy_pass only re-resolves when it uses a variable.
  resolver 127.0.0.11 valid=10s;

  location /api/ {
    set $backend http://backend:8080;
    proxy_pass $backend;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Server-Sent Events need an unbuffered, long-lived connection.
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_read_timeout 1h;
  }

  location / {
    set $frontend http://frontend:80;
    proxy_pass $frontend;
    proxy_set_header Host $host;
  }
}
