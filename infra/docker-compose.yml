name: food4good

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: food4good
      POSTGRES_USER: food4good
      POSTGRES_PASSWORD: food4good
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U food4good -d food4good"]
      interval: 2s
      timeout: 3s
      retries: 30

  backend:
    build: ../backend
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/food4good
      DATABASE_USER: food4good
      DATABASE_PASSWORD: food4good
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ../frontend

  gateway:
    image: nginx:1.29-alpine
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8000:80"
    depends_on:
      - backend
      - frontend

volumes:
  postgres-data:
