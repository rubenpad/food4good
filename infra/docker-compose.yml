name: food4good

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: food4good
      POSTGRES_USER: food4good
      POSTGRES_PASSWORD: food4good
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U food4good -d food4good"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Simulates the Farmers Market. Point FOOD4GOOD_MARKET_URL elsewhere to use a real one.
  wiremock:
    image: wiremock/wiremock:3.13.2
    command: ["--disable-banner"]
    volumes:
      - ./wiremock:/home/wiremock:ro

  backend:
    build: ../backend
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/food4good
      DATABASE_USER: food4good
      DATABASE_PASSWORD: food4good
      FOOD4GOOD_KITCHEN_COOKS: ${FOOD4GOOD_KITCHEN_COOKS:-4}
      FOOD4GOOD_KITCHEN_MAX_WAIT: ${FOOD4GOOD_KITCHEN_MAX_WAIT:-2h}
      FOOD4GOOD_KITCHEN_PREPARATION_TIME_SCALE: ${FOOD4GOOD_KITCHEN_PREPARATION_TIME_SCALE:-1.0}
      FOOD4GOOD_STORAGE_INITIAL_STOCK: ${FOOD4GOOD_STORAGE_INITIAL_STOCK:-5}
      FOOD4GOOD_STORAGE_RECONCILE_INTERVAL: ${FOOD4GOOD_STORAGE_RECONCILE_INTERVAL:-30s}
      # Unset: nothing is exported. Set it (e.g. in a .env file) to send traces, metrics and logs to Honeycomb.
      HONEYCOMB_API_KEY: ${HONEYCOMB_API_KEY:-}
      HONEYCOMB_ENDPOINT: ${HONEYCOMB_ENDPOINT:-https://api.honeycomb.io}
      HONEYCOMB_METRICS_DATASET: ${HONEYCOMB_METRICS_DATASET:-food4good-metrics}
      FOOD4GOOD_MARKET_URL: ${FOOD4GOOD_MARKET_URL:-http://wiremock:8080}
      FOOD4GOOD_MARKET_CONNECT_TIMEOUT: ${FOOD4GOOD_MARKET_CONNECT_TIMEOUT:-1s}
      FOOD4GOOD_MARKET_READ_TIMEOUT: ${FOOD4GOOD_MARKET_READ_TIMEOUT:-2s}
      FOOD4GOOD_MARKET_MAX_CONCURRENT_CALLS: ${FOOD4GOOD_MARKET_MAX_CONCURRENT_CALLS:-20}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      wiremock:
        condition: service_started

  frontend:
    build: ../frontend

  gateway:
    image: nginx:1.29-alpine
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8000:80"
    depends_on:
      - backend
      - frontend

volumes:
  postgres-data:
